<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" font-family="system-ui,-apple-system,Segoe UI,sans-serif" role="img" aria-label="The Jasper loop: codebase, init, decisions, brief/MCP/check, agent, back to codebase">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1.2 9 5 0 8.8z" fill="#3a332d"/>
    </marker>
    <style>
      .w { fill:none; stroke:#3a332d; stroke-width:1.5 }
      .box { fill:#151311; stroke:#2b2622; stroke-width:1.5 }
      .t { fill:#ece7e0; font-size:14px; font-weight:600; text-anchor:middle }
      .m { font-family:ui-monospace,Menlo,monospace; font-size:12.5px; font-weight:500 }
      .s { fill:#6f675f; font-size:10px; text-anchor:middle; font-family:ui-monospace,Menlo,monospace }
    </style>
  </defs>

  <rect width="880" height="480" fill="#0d0c0b"/>

  <!-- wires -->
  <path class="w" d="M230 71H330" marker-end="url(#a)"/>
  <path class="w" d="M520 71H620" marker-end="url(#a)"/>
  <path class="w" d="M730 102V190" marker-end="url(#a)"/>
  <path class="w" d="M730 102V160H425V190" marker-end="url(#a)"/>
  <path class="w" d="M730 102V160H135V190" marker-end="url(#a)"/>
  <path class="w" d="M425 268V350" marker-end="url(#a)"/>
  <path class="w" d="M135 268V320H425V350" marker-end="url(#a)"/>
  <path class="w" d="M730 268V320H425V350" marker-end="url(#a)"/>
  <path class="w" d="M425 412V446H14V71H40" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="200" y="466" fill="#6f675f" font-size="10.5" font-family="ui-monospace,Menlo,monospace">a new architectural choice — propose_decision, or a human edit</text>

  <!-- row 1 -->
  <rect class="box" x="40" y="40" width="190" height="62" rx="10"/>
  <text class="t" x="135" y="68">your codebase</text>
  <text class="s" x="135" y="86">Go · TS · Python · Rust</text>

  <rect class="box" x="330" y="40" width="190" height="62" rx="10"/>
  <text class="t m" x="425" y="68">jasper init</text>
  <text class="s" x="425" y="86">observe — never invent</text>

  <rect x="620" y="40" width="220" height="62" rx="10" fill="#241d15" stroke="#f1c07d" stroke-width="1.5"/>
  <text class="t m" x="730" y="68" fill="#f1c07d">.jasper/decisions/*.yaml</text>
  <text class="s" x="730" y="86">committed to git</text>

  <!-- row 2 -->
  <rect class="box" x="48" y="190" width="174" height="78" rx="10"/>
  <text class="t m" x="135" y="217">jasper brief</text>
  <text class="s" x="135" y="237">static constraints</text>
  <text class="s" x="135" y="251">appended to CLAUDE.md</text>

  <rect class="box" x="338" y="190" width="174" height="78" rx="10"/>
  <text class="t" x="425" y="217">MCP pre-flight</text>
  <text class="s" x="425" y="237">the agent asks</text>
  <text class="s" x="425" y="251">before it writes</text>

  <rect x="633" y="190" width="194" height="78" rx="10" fill="#15190f" stroke="#57713f" stroke-width="1.5"/>
  <text class="t m" x="730" y="217">jasper check</text>
  <text class="s" x="730" y="237">the gate —</text>
  <text class="s" x="730" y="251">exit 1 on violation</text>

  <!-- row 3 -->
  <rect class="box" x="330" y="350" width="190" height="62" rx="10"/>
  <text class="t" x="425" y="386">the agent writes code</text>
</svg>
