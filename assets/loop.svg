<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" role="img" aria-label="The Jasper loop: codebase, init, decisions, brief/MCP/check, agent, back to codebase">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0.8 9.2 5 0 9.2z" fill="#17140f"/>
    </marker>
    <style>
      .w  { fill:none; stroke:#17140f; stroke-width:2 }
      .sh { fill:#17140f }
      .bx { fill:#f2dcc8; stroke:#17140f; stroke-width:2 }
      .t  { fill:#17140f; font-size:13.5px; font-weight:700; text-anchor:middle }
      .s  { fill:#8a7d70; font-size:10px; text-anchor:middle }
    </style>
  </defs>

  <rect width="880" height="500" fill="#fffcf8"/>

  <!-- wires -->
  <path class="w" d="M230 72H330" marker-end="url(#a)"/>
  <path class="w" d="M520 72H618" marker-end="url(#a)"/>
  <path class="w" d="M730 104V192" marker-end="url(#a)"/>
  <path class="w" d="M730 104V156H425V192" marker-end="url(#a)"/>
  <path class="w" d="M730 104V156H135V192" marker-end="url(#a)"/>
  <path class="w" d="M425 274V356" marker-end="url(#a)"/>
  <path class="w" d="M135 274V322H425V356" marker-end="url(#a)"/>
  <path class="w" d="M730 274V322H425V356" marker-end="url(#a)"/>
  <path class="w" d="M425 420V452H16V72H40" stroke-dasharray="6 5" marker-end="url(#a)"/>
  <text x="210" y="474" fill="#8a7d70" font-size="10.5">a new architectural choice — propose_decision, or a human edit</text>

  <!-- row 1 -->
  <rect class="sh" x="44" y="44" width="190" height="64" rx="4"/>
  <rect class="bx" x="40" y="40" width="190" height="64" rx="4"/>
  <text class="t" x="135" y="70">your codebase</text>
  <text class="s" x="135" y="88">Go · TS · Py · Rust</text>

  <rect class="sh" x="334" y="44" width="190" height="64" rx="4"/>
  <rect class="bx" x="330" y="40" width="190" height="64" rx="4" fill="#fffcf8"/>
  <text class="t" x="425" y="70">jasper init</text>
  <text class="s" x="425" y="88">observe, never invent</text>

  <rect class="sh" x="622" y="44" width="224" height="64" rx="4"/>
  <rect class="bx" x="618" y="40" width="224" height="64" rx="4" fill="#f1c07d"/>
  <text class="t" x="730" y="70">decisions/*.yaml</text>
  <text class="s" x="730" y="88" fill="#5a5148">committed to git</text>

  <!-- row 2 -->
  <rect class="sh" x="44" y="196" width="190" height="82" rx="4"/>
  <rect class="bx" x="40" y="192" width="190" height="82" rx="4" fill="#fffcf8"/>
  <text class="t" x="135" y="220">jasper brief</text>
  <text class="s" x="135" y="240">static constraints</text>
  <text class="s" x="135" y="255">into CLAUDE.md</text>

  <rect class="sh" x="334" y="196" width="190" height="82" rx="4"/>
  <rect class="bx" x="330" y="192" width="190" height="82" rx="4" fill="#fffcf8"/>
  <text class="t" x="425" y="220">MCP pre-flight</text>
  <text class="s" x="425" y="240">the agent asks</text>
  <text class="s" x="425" y="255">before it writes</text>

  <rect class="sh" x="622" y="196" width="224" height="82" rx="4"/>
  <rect class="bx" x="618" y="192" width="224" height="82" rx="4" fill="#4a9a5c"/>
  <text class="t" x="730" y="220" fill="#fffcf8">jasper check</text>
  <text class="s" x="730" y="240" fill="#e6f2e8">the gate —</text>
  <text class="s" x="730" y="255" fill="#e6f2e8">exit 1 on violation</text>

  <!-- row 3 -->
  <rect class="sh" x="334" y="360" width="190" height="64" rx="4"/>
  <rect class="bx" x="330" y="356" width="190" height="64" rx="4"/>
  <text class="t" x="425" y="394">agent writes code</text>
</svg>
